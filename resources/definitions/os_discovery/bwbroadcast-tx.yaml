mib: BW-V3-TRANSMITTER-MIB

modules:
  os:
    hardware: 'BW-V3-TRANSMITTER-MIB::systemProductId.0'
    serial:   'BW-V3-TRANSMITTER-MIB::systemSerialNumber.0'
    version:  'BW-V3-TRANSMITTER-MIB::systemSoftwareVersion.0'

  sensors:

    # -----------------------------------------------------------------------
    # Power (Watts) - all from walkable .167.9 subtree
    # -----------------------------------------------------------------------
    power:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersPafwd'
          num_oid: '.1.3.6.1.4.1.38508.167.9.15.{{ $index }}'
          descr: 'PA Forward Power'
          group: 'RF Power'
          index: 'metersPafwd.{{ $index }}'
          skip_value_lt: 0

        - oid: 'BW-V3-TRANSMITTER-MIB::metersParev'
          num_oid: '.1.3.6.1.4.1.38508.167.9.16.{{ $index }}'
          descr: 'PA Reverse Power'
          group: 'RF Power'
          index: 'metersParev.{{ $index }}'
          skip_value_lt: 0

        - oid: 'BW-V3-TRANSMITTER-MIB::metersAcrfeff'
          num_oid: '.1.3.6.1.4.1.38508.167.9.1.{{ $index }}'
          descr: 'AC RF Efficiency'
          group: 'RF Power'
          index: 'metersAcrfeff.{{ $index }}'
          skip_value_lt: 0

        # PSU voltage: returns e.g. "350" = 35.0V
        - oid: 'BW-V3-TRANSMITTER-MIB::metersPsuvoltage'
          num_oid: '.1.3.6.1.4.1.38508.167.9.22.{{ $index }}'
          descr: 'PSU Voltage'
          group: 'Power Supply'
          index: 'metersPsuvoltage.{{ $index }}'
          divisor: 10
          skip_value_lt: 0

        # PSU current: returns e.g. "801" = 8.01A
        - oid: 'BW-V3-TRANSMITTER-MIB::metersPsucurrent'
          num_oid: '.1.3.6.1.4.1.38508.167.9.21.{{ $index }}'
          descr: 'PSU Current'
          group: 'Power Supply'
          index: 'metersPsucurrent.{{ $index }}'
          divisor: 100
          skip_value_lt: 0

        # Aux voltage: returns e.g. "150" = 15.0V
        - oid: 'BW-V3-TRANSMITTER-MIB::metersAuxvoltage'
          num_oid: '.1.3.6.1.4.1.38508.167.9.7.{{ $index }}'
          descr: 'Aux Voltage'
          group: 'Power Supply'
          index: 'metersAuxvoltage.{{ $index }}'
          divisor: 10
          skip_value_lt: 0

        - oid: 'BW-V3-TRANSMITTER-MIB::metersAuxcurrent'
          num_oid: '.1.3.6.1.4.1.38508.167.9.6.{{ $index }}'
          descr: 'Aux Current'
          group: 'Power Supply'
          index: 'metersAuxcurrent.{{ $index }}'
          skip_value_lt: 0

        # Mains voltage: returns e.g. "2371" = 237.1V
        - oid: 'BW-V3-TRANSMITTER-MIB::metersMainsv'
          num_oid: '.1.3.6.1.4.1.38508.167.9.14.{{ $index }}'
          descr: 'Mains Voltage'
          group: 'Power Supply'
          index: 'metersMainsv.{{ $index }}'
          divisor: 10
          skip_value_lt: 0

    # -----------------------------------------------------------------------
    # Temperature (Celsius)
    # PSU temps return e.g. "382" = 38.2C
    # -----------------------------------------------------------------------
    temperature:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersPatemp'
          num_oid: '.1.3.6.1.4.1.38508.167.9.17.{{ $index }}'
          descr: 'PA Temperature'
          group: 'Temperature'
          index: 'metersPatemp.{{ $index }}'
          skip_value_lt: 0

        - oid: 'BW-V3-TRANSMITTER-MIB::metersPsu1temp1'
          num_oid: '.1.3.6.1.4.1.38508.167.9.19.{{ $index }}'
          descr: 'PSU 1 Temperature'
          group: 'Temperature'
          index: 'metersPsu1temp1.{{ $index }}'
          divisor: 10
          skip_value_lt: 0

        - oid: 'BW-V3-TRANSMITTER-MIB::metersPsu2temp1'
          num_oid: '.1.3.6.1.4.1.38508.167.9.20.{{ $index }}'
          descr: 'PSU 2 Temperature'
          group: 'Temperature'
          index: 'metersPsu2temp1.{{ $index }}'
          divisor: 10
          skip_value_lt: 1

    # -----------------------------------------------------------------------
    # Fan Speed (RPM)
    # -----------------------------------------------------------------------
    fanspeed:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersFanspeed'
          num_oid: '.1.3.6.1.4.1.38508.167.9.9.{{ $index }}'
          descr: 'Fan Speed'
          group: 'Cooling'
          index: 'metersFanspeed.{{ $index }}'
          skip_value_lt: 0

    # -----------------------------------------------------------------------
    # Frequency (MHz) - stored in Hz, divide by 1000000
    # Note: .167.17 has OID ordering bug - only first OID in walk returns
    # -----------------------------------------------------------------------
    frequency:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::transmitterFrequency'
          num_oid: '.1.3.6.1.4.1.38508.167.17.3.{{ $index }}'
          descr: 'Transmit Frequency'
          group: 'RF'
          index: 'transmitterFrequency.{{ $index }}'
          divisor: 1000000
          skip_value_lt: 0

    # -----------------------------------------------------------------------
    # FM Peak Deviation (kHz)
    # -----------------------------------------------------------------------
    signal:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersPeakDeviation'
          num_oid: '.1.3.6.1.4.1.38508.167.9.18.{{ $index }}'
          descr: 'Peak Deviation'
          group: 'Modulation'
          index: 'metersPeakDeviation.{{ $index }}'
          skip_value_lt: 0

    # -----------------------------------------------------------------------
    # Audio levels (dBr) - from walkable .167.9 subtree only
    # MPX subtree (.167.10) excluded due to OID ordering bug
    # -----------------------------------------------------------------------
    dbm:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersTxInputL'
          num_oid: '.1.3.6.1.4.1.38508.167.9.23.{{ $index }}'
          descr: 'TX Input Left'
          group: 'Audio'
          index: 'metersTxInputL.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersTxInputR'
          num_oid: '.1.3.6.1.4.1.38508.167.9.24.{{ $index }}'
          descr: 'TX Input Right'
          group: 'Audio'
          index: 'metersTxInputR.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersTxOutputL'
          num_oid: '.1.3.6.1.4.1.38508.167.9.25.{{ $index }}'
          descr: 'TX Output Left'
          group: 'Audio'
          index: 'metersTxOutputL.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersTxOutputR'
          num_oid: '.1.3.6.1.4.1.38508.167.9.27.{{ $index }}'
          descr: 'TX Output Right'
          group: 'Audio'
          index: 'metersTxOutputR.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersTxOutputMpx'
          num_oid: '.1.3.6.1.4.1.38508.167.9.26.{{ $index }}'
          descr: 'TX Output MPX'
          group: 'Audio'
          index: 'metersTxOutputMpx.{{ $index }}'

    # -----------------------------------------------------------------------
    # AGC / Limiter gain reduction stages
    # -----------------------------------------------------------------------
    load:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersAgc1'
          num_oid: '.1.3.6.1.4.1.38508.167.9.2.{{ $index }}'
          descr: 'AGC Stage 1'
          group: 'Audio Processing'
          index: 'metersAgc1.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersAgc2'
          num_oid: '.1.3.6.1.4.1.38508.167.9.3.{{ $index }}'
          descr: 'AGC Stage 2'
          group: 'Audio Processing'
          index: 'metersAgc2.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersAgc3'
          num_oid: '.1.3.6.1.4.1.38508.167.9.4.{{ $index }}'
          descr: 'AGC Stage 3'
          group: 'Audio Processing'
          index: 'metersAgc3.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersAgc4'
          num_oid: '.1.3.6.1.4.1.38508.167.9.5.{{ $index }}'
          descr: 'AGC Stage 4'
          group: 'Audio Processing'
          index: 'metersAgc4.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersLim1'
          num_oid: '.1.3.6.1.4.1.38508.167.9.10.{{ $index }}'
          descr: 'Limiter Stage 1'
          group: 'Audio Processing'
          index: 'metersLim1.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersLim2'
          num_oid: '.1.3.6.1.4.1.38508.167.9.11.{{ $index }}'
          descr: 'Limiter Stage 2'
          group: 'Audio Processing'
          index: 'metersLim2.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersLim3'
          num_oid: '.1.3.6.1.4.1.38508.167.9.12.{{ $index }}'
          descr: 'Limiter Stage 3'
          group: 'Audio Processing'
          index: 'metersLim3.{{ $index }}'

        - oid: 'BW-V3-TRANSMITTER-MIB::metersLim4'
          num_oid: '.1.3.6.1.4.1.38508.167.9.13.{{ $index }}'
          descr: 'Limiter Stage 4'
          group: 'Audio Processing'
          index: 'metersLim4.{{ $index }}'

    # -----------------------------------------------------------------------
    # State sensors
    # Alarms/fallback return "0"/"1" strings
    # Status flags return "off"/"on" strings
    # Clock lock returns "1"=locked / "0"=unlocked
    # -----------------------------------------------------------------------
    state:
      data:
        - oid: 'BW-V3-TRANSMITTER-MIB::metersFallback'
          num_oid: '.1.3.6.1.4.1.38508.167.9.8.{{ $index }}'
          descr: 'Fallback Active'
          group: 'RF Status'
          index: 'metersFallback.{{ $index }}'
          states:
            - { value: '0', generic: 0, graph: 0, descr: 'Normal' }
            - { value: '1', generic: 1, graph: 1, descr: 'Fallback' }

        - oid: 'BW-V3-TRANSMITTER-MIB::statusVSWRLimitActive'
          num_oid: '.1.3.6.1.4.1.38508.167.15.2.{{ $index }}'
          descr: 'VSWR Limit Active'
          group: 'RF Status'
          index: 'statusVSWRLimitActive.{{ $index }}'
          states:
            - { value: 'off', generic: 0, graph: 0, descr: 'OK' }
            - { value: 'on',  generic: 2, graph: 1, descr: 'VSWR Limit Active' }

        - oid: 'BW-V3-TRANSMITTER-MIB::statusTempLimitActive'
          num_oid: '.1.3.6.1.4.1.38508.167.15.1.{{ $index }}'
          descr: 'Temperature Limit Active'
          group: 'RF Status'
          index: 'statusTempLimitActive.{{ $index }}'
          states:
            - { value: 'off', generic: 0, graph: 0, descr: 'OK' }
            - { value: 'on',  generic: 2, graph: 1, descr: 'Temp Limit Active' }

        - oid: 'BW-V3-TRANSMITTER-MIB::alarmactiveA'
          num_oid: '.1.3.6.1.4.1.38508.167.22.1.{{ $index }}'
          descr: 'Alarm A Active'
          group: 'Alarms'
          index: 'alarmactiveA.{{ $index }}'
          states:
            - { value: '0', generic: 0, graph: 0, descr: 'OK' }
            - { value: '1', generic: 2, graph: 1, descr: 'Alarm Active' }

        - oid: 'BW-V3-TRANSMITTER-MIB::alarmactiveB'
          num_oid: '.1.3.6.1.4.1.38508.167.22.2.{{ $index }}'
          descr: 'Alarm B Active'
          group: 'Alarms'
          index: 'alarmactiveB.{{ $index }}'
          states:
            - { value: '0', generic: 0, graph: 0, descr: 'OK' }
            - { value: '1', generic: 2, graph: 1, descr: 'Alarm Active' }

        - oid: 'BW-V3-TRANSMITTER-MIB::alarmactiveC'
          num_oid: '.1.3.6.1.4.1.38508.167.22.3.{{ $index }}'
          descr: 'Alarm C Active'
          group: 'Alarms'
          index: 'alarmactiveC.{{ $index }}'
          states:
            - { value: '0', generic: 0, graph: 0, descr: 'OK' }
            - { value: '1', generic: 2, graph: 1, descr: 'Alarm Active' }

        - oid: 'BW-V3-TRANSMITTER-MIB::meteringClockLockStatus'
          num_oid: '.1.3.6.1.4.1.38508.167.8.1.{{ $index }}'
          descr: 'Clock Lock Status'
          group: 'SFN'
          index: 'meteringClockLockStatus.{{ $index }}'
          states:
            - { value: '0', generic: 2, graph: 0, descr: 'Unlocked' }
            - { value: '1', generic: 0, graph: 1, descr: 'Locked' }
