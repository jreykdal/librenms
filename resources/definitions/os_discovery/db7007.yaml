mib: DB7007-MIB:SNMPv2-MIB
modules:
    os:
        hardware: SNMPv2-MIB::sysDescr.0
        serial: DB7007-MIB::sernum.0
        version: DB7007-MIB::fwrev.0
    sensors:
        temperature:
            data:
                -
                    oid: statusTempcValue.0
                    value: statusTempcValue
                    num_oid: '.1.3.6.1.4.1.35833.18.3.26.0'
                    index: 'statusTempcValue.0'
                    descr: Temperature
                    high_limit: 41
                    low_limit: 5
                    low_warn_limit: 10
                    warn_limit: 39
                    divisor: 256

        frequency:
            data:
                -
                    oid: statusFreq.0
                    value: statusFreq
                    num_oid: '.1.3.6.1.4.1.35833.18.3.3.0'
                    index: 'statusFreq.0'
                    descr: Frequency
                    high_limit: 108000
                    low_limit: 87500
                    low_warn_limit: 87500
                    warn_limit: 108000
                    multiplier: 1000

                -
                    oid: statusPilotValue.0
                    value: statusPilotValue
                    num_oid: '.1.3.6.1.4.1.35833.18.3.13.0'
                    index: 'statusPilotValue.0'
                    descr: Pilot
                    high_limit: 8
                    low_limit: 4
                    low_warn_limit: 4.1
                    warn_limit: 7.9
                    divisor: 256

        tv_signal:
            data:
                -
                    oid: statusRflvlValue.0
                    value: statusRflvlValue
                    num_oid: '.1.3.6.1.4.1.35833.18.3.4.0'
                    index: 'statusRflvlValue.0'
                    descr: RF Level
                    high_limit: 83
                    low_limit: 34
                    low_warn_limit: 39
                    warn_limit: 79
                    divisor: 256

        fanspeed:
            data:
                -
                    oid: statusFanrpmValue.0
                    value: statusFanrpmValue
                    num_oid: '.1.3.6.1.4.1.35833.18.3.29.0'
                    index: 'statusFanrpmValue.0'
                    descr: Fanspeed
                    high_limit: 5000
                    low_limit: 0
                    low_warn_limit: 800
                    warn_limit: 4500
                    divisor: 1

        state:
            data:
                -
                    oid: statusRdsLock.0
                    value: statusRdsLock
                    num_oid: '.1.3.6.1.4.1.35833.18.3.32.0'
                    descr: RDS Lock
                    index: 'statusRdsLock.0'
                    state_name: statusRdsLock
                    states:
                        - { value: 1, generic: 2, graph: 1, descr: OFF }
                        - { value: 2, generic: 0, graph: 1, descr: ON }

                -
                    oid: statusAudioStereo.0
                    value: statusAudioStereo
                    num_oid: '.1.3.6.1.4.1.35833.18.3.25.0'
                    descr: Stereo/Mono
                    index: 'statusAudioStereo.0'
                    state_name: statusAudioStereo
                    states:
                        - { value: 8, generic: 1, graph: 1, descr: MONO }
                        - { value: 9, generic: 0, graph: 1, descr: STEREO }
                        - { value: 10, generic: 1, graph: 1, descr: SPEECH }
                -

                    oid: statusSource.0
                    value: statusSource
                    num_oid: '.1.3.6.1.4.1.35833.18.3.1'
                    descr: Input Main/Backup
                    index: 'statusSource.0'
                    state_name: statusSource
                    states:
                        - { value: 1, generic: 0, graph: 1, descr: MAIN }
                        - { value: 2, generic: 2, graph: 1, descr: BACKUP }
                        - { value: 5, generic: 2, graph: 1, descr: IP CLIENT }

