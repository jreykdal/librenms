mib: DB7001-MIB:SNMPv2-MIB
modules:
    os:
      hardware: SNMPv2-MIB::sysDescr.0
      serial: DB7001-MIB::sernum.0
      version: DB7001-MIB::fwrev.0
    sensors:
        temperature:
            data:
                -
                   oid: mntrTempcValue.0
                   value: mntrTempcValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.39.0'
                   index: 'mntrTempcValue.0'
                   descr: temp
                   high_limit: 41
                   low_limit: 05
                   low_warn_limit: 10
                   warn_limit: 39
                   divisor: 256

        frequency:
            data:
                -
                   oid: mntrFreq.0
                   value: mntrFreq
                   num_oid: '.1.3.6.1.4.1.35833.37.3.1.0'
                   index: 'mntrFreq.0'
                   descr: Frequency
                   high_limit: 93000000
                   low_limit: 92000000
                   low_warn_limit: 0
                   warn_limit: 0
                   multiplier: 1000

                -
                   oid: mntrPilotValue.0
                   value: mntrPilotValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.14.0'
                   index: 'mntrPilotValue.0'
                   descr: Pilot
                   high_limit: 8
                   low_limit: 4
                   low_warn_limit: 4.1
                   warn_limit: 7.9
                   divisor: 256

        tv_signal:
            data:
                -
                   oid: mntrRflvlValue.0
                   value: mntrRflvlValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.2.0'
                   index: 'mntrRflvlValue.0'
                   descr: RF Level
                   high_limit: 83
                   low_limit: 34
                   low_warn_limit: 39
                   warn_limit: 79
                   divisor: 256

        fanspeed:
            data:
                -
                   oid: mntrFanrpmValue.0
                   value: mntrFanrpmValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.42.0'
                   index: 'mntrFanrpmValue.0'
                   descr: Fanspeed
                   high_limit: 2500
                   low_limit: 500
                   low_warn_limit: 900
                   warn_limit: 2500
                   divisor: 1


        state:
            data:
                -
                   oid: mntrRdsLock.0
                   value: mntrRdsLock
                   num_oid: '.1.3.6.1.4.1.35833.37.3.27.0'
                   descr: RDS Lock
                   index: 'mntrRdsLock.0'
                   state_name: mntrRdsLock
                   states:
                       - { value:  1, generic: 2, graph: 1, descr: OFF }
                       - { value:  2, generic: 0, graph: 1, descr: ON }

                -
                   oid: mntrAudioStereo.0
                   value: mntrAudioStereo
                   num_oid: '.1.3.6.1.4.1.35833.37.3.38.0'
                   descr: Stereo/Mono
                   index: 'mntrAudioStereo.0'
                   state_name: mntrAudioStereo
                   states:
                       - { value:  8, generic: 1, graph: 1, descr: MONO }
                       - { value:  9, generic: 0, graph: 1, descr: STEREO }
 
