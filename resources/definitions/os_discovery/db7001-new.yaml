mib: DB7001-MIB:SNMPv2-MIB
modules:
    os:
      hardware: SNMPv2-MIB::sysDescr.0
      serial: DB7001-MIB::sernum.0
      version: DB7001-MIB::fwrev.0
    sensors:
        temperature:
            data:
                -
                #  oid: mntrTempcValue
                   value: mntrTempcValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.39.0'
                   index: 'tempReading.0}'
                   descr: temp
                   high_limit: 35
                   low_limit: 0
                   low_warn_limit: 10
                   warn_limit: 30
                   divisor: 256

        frequency:
            data:
                -
                #  oid: mntrFreq
                   num_oid: '.1.3.6.1.4.1.35833.37.3.1.0'
                   index: 'mntrFreq.0'
                   descr: Frequency
                   high_limit: 93000000
                   low_limit: 92000000
                   low_warn_limit: 0
                   warn_limit: 0
                   multiplier: 1000
          
                -
                #  oid: mntrPilotValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.14.{{ $index }}'
                   index: 'mntrPilotValue.{{ $index }}'
                   descr: Pilot
                   high_limit: 8
                   low_limit: 4
                   low_warn_limit: 4.1
                   warn_limit: 7.9
                   divisor: 256


        tv_signal:
            data:
                -
                #  oid: mntrRflvlValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.2.{{ $index }}'
                   index: 'mntrRflvlValue.{{ $index }}'
                   descr: RF Level
                   high_limit: 83
                   low_limit: 34
                   low_warn_limit: 39
                   warn_limit: 79
                   divisor: 256

        fanspeed:
            data:
                -
                #  oid: mntrFanrpmValue
                   num_oid: '.1.3.6.1.4.1.35833.37.3.42.{{ $index }}'
                   index: 'mntrFanrpmValue.{{ $index }}'
                   descr: Fanspeed
                   high_limit: 2500
                   low_limit: 0
                   low_warn_limit: 2000
                   warn_limit: 2400
                   divisor: 1

        state:
            data:
                -
                #   oid: mntrRdsLock
                   num_oid: '.1.3.6.1.4.1.35833.37.3.27.{{ $index }}'
                   descr: RDS Lock
                   index: 'mntrRdsLock.{{ $index }}'
                   state_name: DB7001-MIB:mntrRdsLock
                   states:
                       - { value:  1, generic: 0, graph: 1, descr: OFF }
                       - { value:  2, generic: 1, graph: 1, descr: ON }

                -
                #                   oid: mntrAudioStereo
                   num_oid: '.1.3.6.1.4.1.35833.37.3.38.{{ $index }}'
                   descr: Stereo/Mono
                   index: 'mntrAudioStereo.{{ $index }}'
                   state_name: DB7001-MIB:mntrAudioStereo
                   states:
                       - { value:  8, generic: 0, graph: 1, descr: MONO }
                       - { value:  9, generic: 1, graph: 1, descr: STEREO }
 
